app = "kpc-fuel-batch-scheduler"
primary_region = "jnb"  # Johannesburg -- closest Fly region to Kenya as of writing; check fly platform status for a Nairobi-region option

[build]

[env]
  PORT = "8080"
  ALLOWED_ORIGIN = "*"  # tighten before go-live
  FLASK_DEBUG = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # keep the instance warm -- avoids cold-start lag during the live demo
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "3s"
  path = "/health"
